name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    container: texlive/texlive@sha256:b20c42c2a5b1be892c26e6d3b896e9aa20350528ddd0d4444d23e5925ea1545d
    steps:
      - uses: actions/checkout@v4
      - name: Prepare test tools
        run: |
          apt-get update -qq
          apt-get install -y python3-venv
          python3 -m venv /tmp/nbeamer-env
          /tmp/nbeamer-env/bin/pip install PyMuPDF==1.28.2
          echo /tmp/nbeamer-env/bin >> "$GITHUB_PATH"
      - name: Build assets and install with fonts
        run: |
          ./dev package --repo "$GITHUB_REPOSITORY"
          python .build/dist/nbeamer install
      - name: Run regressions and build documentation
        run: |
          ./dev test
          ./dev docs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: layout-diagnostics
          path: .build/tests
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: .build/dist/nbeamer
          include-hidden-files: true
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: .build/dist
      - run: gh release create "$TAG" .build/dist/nbeamer --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
